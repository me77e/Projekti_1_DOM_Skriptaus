<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reissuun lähdön to-do lista</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">

    <div class="image-section">
        <img src="image/matkalaukku.jpg" alt="Pakattu matkalaukku">
    </div>

<div class="list-section">
    <h1>Reissuun lähtö to-do lista</h1>
    <h4> Tämä on interaktiivinen pakkauslista, jonka avulla käyttäjä voi suunnitella ja seurata matkalle tarvittavien tavaroiden pakkaamista.</h4>
    <br>
    <h5> Kirjoita tarvike -> Paina lisää -> tarvike siirtyy automaattisesti taulukkoon. </h5>
    <div class="input-section">
        <label for="itemInput">Lisättävä tarvike:</label>
        <input
            type="text"
            id="itemInput"
            placeholder="Passi"
        >
        <button id="addButton">Lisää</button>
    </div>
<table id="packingTable">
    <thead>
        <tr>
            <th>Tarvike</th>
        </tr>
    </thead>

    <tbody id="packingList">
        <tr>
            <td>Passi</td>
        </tr>
    </tbody>
</table>
    </div>
    </div>

</body>
</html>
