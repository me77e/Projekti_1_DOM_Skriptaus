<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reissuun lähdön to-do lista</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="container">

    <div class="image-section">
        <img src="image/wireframe.png">
    </div>

<div class="list-section">
    <h1>Reissuun lähtö to-do lista</h1>
    <h4> Tämä on interaktiivinen pakkauslista, jonka avulla käyttäjä voi suunnitella ja seurata matkalle tarvittavien tavaroiden pakkaamista.</h4>
    <h5> Kirjoita tarvike -> Paina lisää -> tarvike siirtyy automaattisesti taulukkoon. </h5>
    <div class="input-section">
        <label for="itemInput">Lisättävä tarvike:</label>
        <input
            type="text"
            id="itemInput"
            placeholder="Kirjoita tähän lisättävä tarvike..."
        >
        <button id="addButton">Lisää</button>
    </div>
    <p id="itemCounter">Pakkaamatta: 0</p>

    <div class="storage-buttons">
    <button id="saveButton">Tallenna</button>
    <button id="loadButton">Hae lista</button>
    </div>

    <table id="packingTable">
    <thead>
        <tr>
            <th colspan="2">Tarvike</th>
        </tr>
    </thead>

    <tbody id="packingList">
    </tbody>
</table>
    </div>
    </div>
</body>
</html>
